name: Validate portable skill

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly verification; never modifies the repository.
    - cron: '23 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-check-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          # The skill promises Python 3.10+; the last version listed becomes the default `python`.
          python-version: |
            3.10
            3.12
      - name: Tests on the oldest supported Python (3.10)
        run: python3.10 -m unittest discover -s tests
      - name: Validate skill files and gate logic
        run: python -m unittest discover -s tests -v
      - name: Validate initial state template
        run: python layout-first-engineering/scripts/verify_project.py layout-first-engineering/assets/PROJECT_STATE.md
      - name: Build distributable archives
        run: python scripts/build_release.py

  vs01-proof:
    # End-to-end proof of the VS-01 slice in a real browser (RFC-0002). Fails if any `must`
    # requirement lacks a clean passing receipt. Approvals in this run are simulated (lfe demo).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright (pinned) and Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.49.1
          python -m playwright install --with-deps chromium
      - name: Run the VS-01 proof
        run: sh scripts/vs01-proof.sh "$RUNNER_TEMP/vs01"
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vs01-proof
          path: |
            ${{ runner.temp }}/vs01/TEST_REPORT.json
            ${{ runner.temp }}/vs01/.lfe/evidence/
            ${{ runner.temp }}/vs01/.lfe/HANDOFF.md
            ${{ runner.temp }}/vs01/.lfe/studio.html
          if-no-files-found: warn
